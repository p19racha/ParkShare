name: Android release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    concurrency:
      group: android-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Check application
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build Android APK
        env:
          # Skip Android R8 shrinking so the pilot build fits the runner budget.
          ORG_GRADLE_PROJECT_shrink: 'false'
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          : "${SUPABASE_URL:?Set the SUPABASE_URL repository variable}"
          : "${SUPABASE_ANON_KEY:?Set the SUPABASE_ANON_KEY repository variable}"
          : "${ANDROID_KEYSTORE_BASE64:?Set the ANDROID_KEYSTORE_BASE64 repository secret}"
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use a release tag such as v0.1.0"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          install -m 600 /dev/null "$HOME/.android/debug.keystore"
          trap 'rm -f "$HOME/.android/debug.keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          unset ANDROID_KEYSTORE_BASE64
          flutter build apk --release --no-pub --target-platform android-arm64 \
            --build-name="$version" --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define="SUPABASE_URL=$SUPABASE_URL" \
            --dart-define="SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          cp build/app/outputs/flutter-apk/app-release.apk "ParkShare-${GITHUB_REF_NAME}.apk"

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="ParkShare-${GITHUB_REF_NAME}.apk"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$apk" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$apk" --verify-tag \
              --title "ParkShare $GITHUB_REF_NAME" --generate-notes
          fi
